
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — Glow Cart</title>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">

  <style>
    .stock-warning {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 5px;
    }

    .qty-controls button:disabled {
      opacity: .35;
      cursor: not-allowed;
    }

    .cart-item {
      gap: 14px;
    }

    .item-info {
      min-width: 0;
    }

    .item-name {
      overflow-wrap: anywhere;
    }

    .checkout-btn.disabled {
      opacity: .5;
      pointer-events: none;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <nav class="navbar scrolled" id="navbar">
    <a href="/" class="logo">
      Glow Cart <span class="logo-star">✦</span>
    </a>

    <div class="nav-links" id="nav-links">
      <a href="/">Home</a>

      <a href="/cart/" class="nav-cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" width="18" height="18"
             style="vertical-align:middle;margin-right:4px">
          <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
          <line x1="3" y1="6" x2="21" y2="6"/>
          <path d="M16 10a4 4 0 01-8 0"/>
        </svg>
        Cart (<span id="cart-count">0</span>)
      </a>

      {% if user.is_authenticated %}
        <a href="/orders/">My Orders</a>

        {% if user.is_staff %}
          <a href="/dashboard/">Dashboard</a>
        {% endif %}

        <form method="POST" action="/logout/" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="logout-btn">
            {{ user.username }} · Logout
          </button>
        </form>
      {% else %}
        <a href="/login/" class="btn-outline-nav">Login</a>
        <a href="/signup/" class="btn-gold-nav">Sign Up</a>
      {% endif %}
    </div>

    <button class="hamburger" id="hamburger">&#9776;</button>
  </nav>

  <div class="cart-wrapper">
    <h2>Your Cart 🛒</h2>
    <div id="cart-container"></div>
  </div>

  <script>
    // Separate cart storage for every customer account and guests.
    const CART_STORAGE_KEY = {% if user.is_authenticated %}"cart_user_{{ user.id }}"{% else %}"cart_guest"{% endif %};

    function getCart() {
      try {
        const cart = JSON.parse(localStorage.getItem(CART_STORAGE_KEY)) || [];
        return Array.isArray(cart) ? cart : [];
      } catch (error) {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
    }

    function getStockLimit(item) {
      if (item.stock === null || item.stock === undefined) {
        return 0;
      }

      const stock = Number(item.stock);

      return Number.isFinite(stock) && stock > 0 ? stock : 0;
    }

    function buildCartMap(cart) {
      const map = {};

      cart.forEach(item => {
        const id = Number(item.id);

        const key = Number.isInteger(id) && id > 0
          ? String(id)
          : "legacy-" + String(item.name || "");

        const qty = Math.max(1, Number(item.qty) || 1);

        if (map[key]) {
          map[key].qty += qty;
        } else {
          map[key] = {
            id: Number.isInteger(id) && id > 0 ? id : null,
            name: item.name || "Product",
            price: Math.max(0, Number(item.price) || 0),
            qty: qty,
            stock: item.stock === undefined ? null : item.stock
          };
        }
      });

      return Object.values(map);
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      })[char]);
    }

    function saveAndRender(items) {
      saveCart(items);
      render(items);
    }

    function render(items) {
      const container = document.getElementById("cart-container");

      const count = items.reduce(
        (sum, item) => sum + item.qty,
        0
      );

      document.getElementById("cart-count").innerText = count;

      if (items.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <p>🛒 Your cart is empty.</p>
            <a href="/">Continue Shopping</a>
          </div>
        `;
        return;
      }

      let total = 0;
      let hasUnavailableItem = false;
      let html = "";

      items.forEach((item, index) => {
        const stockLimit = getStockLimit(item);
        const unavailable = stockLimit === 0;
        const overStock = !unavailable && item.qty > stockLimit;

        if (unavailable || overStock) {
          hasUnavailableItem = true;
        }

        total += item.price * item.qty;

        let stockMessage = "";

        if (unavailable) {
          stockMessage = `
            <p class="stock-warning">
              This item is unavailable. Please remove it.
            </p>
          `;
        } else if (overStock) {
          stockMessage = `
            <p class="stock-warning">
              Only ${stockLimit} item(s) available. Reduce the quantity.
            </p>
          `;
        }

        html += `
          <div class="cart-item">

            <div class="item-info">
              <div class="item-name">
                ${escapeHTML(item.name)}
              </div>

              <div class="item-price">
                ₹${item.price.toFixed(2)} each
              </div>

              ${stockMessage}
            </div>

            <div class="qty-controls">
              <button
                onclick="changeQty(${index}, -1)"
                aria-label="Decrease quantity"
              >−</button>

              <span>${item.qty}</span>

              <button
                onclick="changeQty(${index}, 1)"
                aria-label="Increase quantity"
                ${unavailable || item.qty >= stockLimit ? "disabled" : ""}
              >+</button>
            </div>

            <button
              class="remove-btn"
              onclick="removeItem(${index})"
              title="Remove"
            >✕</button>

          </div>
        `;
      });

      html += `
        <div class="cart-footer">
          <span class="total-label">Total</span>
          <span class="total-amount">₹${total.toFixed(2)}</span>
        </div>

        ${
          hasUnavailableItem
            ? `<p class="stock-warning" style="margin:12px 0;">
                 Remove unavailable items or correct quantities before checkout.
               </p>`
            : ""
        }

        <a
          href="/checkout/"
          class="checkout-btn ${hasUnavailableItem ? "disabled" : ""}"
          ${
            hasUnavailableItem
              ? 'aria-disabled="true" onclick="return false;"'
              : ""
          }
        >
          Proceed to Checkout →
        </a>
      `;

      container.innerHTML = html;
    }

    function changeQty(index, delta) {
      const items = buildCartMap(getCart());
      const item = items[index];

      if (!item) return;

      const newQty = item.qty + delta;
      const stockLimit = getStockLimit(item);

      if (newQty < 1) {
        items.splice(index, 1);
      } else if (newQty <= stockLimit) {
        item.qty = newQty;
      }

      saveAndRender(items);
    }

    function removeItem(index) {
      const items = buildCartMap(getCart());

      items.splice(index, 1);

      saveAndRender(items);
    }

    function initCart() {
      const items = buildCartMap(getCart());

      saveAndRender(items);
    }

    window.addEventListener("pageshow", initCart);

    document.getElementById("hamburger").addEventListener("click", () => {
      document.getElementById("nav-links").classList.toggle("open");
    });
  </script>

{% include 'whatsapp_support.html' %}
</body>
</html>
